name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/android/*.apk
          generate_release_notes: true
          title: "TITAN OS Production Release ${{ github.ref_name }}"
          body: |
            # 🚀 TITAN OS — Multi-Platform Production Release

            ### 📱 Android APK Downloads (Direct Installation):
            - **ARM64-v8a (Modern 64-bit devices):** `titan-os-arm64-v8a-release-signed.apk` (Recommended)
            - **ARMv7a (32-bit legacy devices):** `titan-os-armeabi-v7a-release-signed.apk`
            - **Universal (All Android devices):** `titan-os-universal-release-signed.apk`

            ### 📋 Installation Guide:
            1. Download the `.apk` directly to your phone.
            2. Tap to install.
            3. If prompted by Play Protect: Tap **More details** -> **Install anyway**.
